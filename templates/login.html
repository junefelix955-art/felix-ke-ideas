{% extends "base.html" %}
{% block title %}Admin login | Felix KE Ideas{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Admin login</h1>
    <p>Sign in to manage messages sent through your website.</p>
    <form action="{{ url_for('login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="button">Log in</button>
    </form>
    <a class="auth-back" href="{{ url_for('index') }}">Back to website</a>
</section>
{% endblock %}
